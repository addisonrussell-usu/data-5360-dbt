version: 2

models:
  - name: oliver_dim_customer
    description: "Oliver Customer Dimension"
    columns:
      - name: cust_key
        tests:
          - unique
  - name: oliver_dim_date
    description: "Oliver Date Dimension"
    columns:
      - name: day_of_week
        tests:
          - accepted_values:
              arguments:
                values:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
  - name: oliver_dim_employee
    description: "Oliver Employee Dimension"
    columns:
      - name: employee_key
        description: "A primary key for the employee dimension"
        tests:
          - not_null
  - name: oliver_dim_product
    description: "Oliver Product Dimension"
  - name: oliver_dim_store
    description: "Oliver Store Dimension"
  - name: fact_sales
    description: "Oliver Sales Fact"
  - name: stg_employee_certifications
    description: |
      Staging model for employee certifications.
      Each record represents an individual certification awarded to an employee.
  - name: fact_certification
    description: |
      Employee Certification Fact.
      The grain of this table is employee + certification + date
      Each record represents a single certification and the cost associated with it for each employee on the day it was awarded.
    columns:
      - name: employee_key
        tests:
          - relationships:
              arguments:
                to: ref('oliver_dim_employee')
                field: employee_key